name: Build TelephoneBeep

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone JUCE
        run: git clone --depth 1 https://github.com/juce-framework/JUCE.git
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TelephoneBeep-Windows
          path: |
            build/TelephoneBeep_artefacts/Release/VST3/
            build/TelephoneBeep_artefacts/Release/Standalone/

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone JUCE
        run: git clone --depth 1 https://github.com/juce-framework/JUCE.git
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TelephoneBeep-macOS
          path: |
            build/TelephoneBeep_artefacts/Release/VST3/
            build/TelephoneBeep_artefacts/Release/AU/
            build/TelephoneBeep_artefacts/Release/Standalone/

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libfreetype6-dev \
            libfontconfig1-dev \
            libx11-dev \
            libxinerama-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxcomposite-dev \
            libxext-dev \
            libcurl4-openssl-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev
      - name: Clone JUCE
        run: git clone --depth 1 https://github.com/juce-framework/JUCE.git
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: TelephoneBeep-Linux
          path: |
            build/TelephoneBeep_artefacts/Release/VST3/
            build/TelephoneBeep_artefacts/Release/Standalone/
